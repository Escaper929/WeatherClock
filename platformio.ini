; =============================================================================
;  WeatherClock - ESP32-C3 Super Mini + ST7789 1.54" 240x240 weather clock
;  参考 BambuHelper 架构：PlatformIO + Arduino + LovyanGFX + ArduinoJson
; =============================================================================

[platformio]
; 默认只构建 esp32c3，其它板子可以后续用 -e 追加（与 BambuHelper 一致）
default_envs = esp32c3

[common]
; 共享依赖
lib_deps =
    lovyan03/LovyanGFX@^1.2.19
    bblanchon/ArduinoJson@^7.0
    ; 中文/平滑字体：efont（tanakamasayuki 出品，原生适配 LovyanGFX，GB2312 全字库）
    tanakamasayuki/efont Unicode Font Data@^1.0.9

; =============================================================================
;  ESP32-C3 Super Mini + ST7789 240x240
;  镜像 BambuHelper 的 [env:esp32c3] 配置
; =============================================================================
[env:esp32c3]
platform = espressif32@6.12.0
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_4mb.csv
lib_deps = ${common.lib_deps}
build_flags =
    -D BOARD_VARIANT=\"esp32c3\"
    ; C3 原生 USB CDC，用 USB 串口输出日志
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; 紧凑构建（低 RAM 板子提示）
    -D BOARD_LOW_RAM=1
    ; 绝大多数 ST7789 模块需要颜色反转，否则黑屏/白底翻转
    -D USE_ST7789_INVERT=1
    ; --- C3 flash 回收（~148 KB）：关闭 C++ 异常，避免 DWARF unwind 表占用，
    ;     参考 BambuHelper 的做法。注意：异常会改为 abort（重启）而非 throw。
    -fno-exceptions
    -fno-unwind-tables
    -fno-asynchronous-unwind-tables
build_unflags =
    -fexceptions