# ============================================================================
#  每次推送到 main 自动完成：
#    1. 用 PlatformIO 编译 ESP32-C3 固件
#    2. 把 4 个 bin 提交回 git 仓库（jsDelivr 镜像需要 bin 在仓库里，国内访问稳定）
#    3. 用「含 bin 的最新 commit」替换 index.html 的 manifest 占位符并发布 GitHub Pages
#  安装页：https://Escaper929.github.io/WeatherClock/
#  前提：仓库 Settings -> Pages -> Source 选择 "GitHub Actions"
# ============================================================================
name: Build & Deploy Web Flasher

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      bin_sha: ${{ steps.bins.outputs.bin_sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install -q platformio

      - name: Generate firmware version
        run: echo "FW_VER=${GITHUB_SHA::7} $(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Build ESP32-C3 firmware
        run: |
          printf '#define FW_VERSION "%s"\n' "$FW_VER" > src/FwVersion.h
          pio run -e esp32c3

      - name: Stage web assets
        run: |
          mkdir -p web
          cp .pio/build/esp32c3/firmware.bin   web/firmware.bin
          cp .pio/build/esp32c3/bootloader.bin web/bootloader.bin
          cp .pio/build/esp32c3/partitions.bin web/partitions.bin
          # boot_app0.bin(2级引导) 不在 .pio/build，路径随框架版本变化，用 find 全局定位
          BOOT0=$(find "$HOME/.platformio" -name 'boot_app0.bin' 2>/dev/null | head -n1)
          if [ -n "$BOOT0" ]; then
            cp "$BOOT0" web/boot_app0.bin
          else
            echo "ERROR: boot_app0.bin not found in PlatformIO packages"; exit 1
          fi
          echo "$FW_VER" > web/version.txt

      # 把固件 bin 提交回仓库，jsDelivr 镜像才能代理到（国内访问稳定）
      - name: Commit firmware binaries to repo
        id: bins
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/firmware.bin web/bootloader.bin web/partitions.bin web/boot_app0.bin web/version.txt
          if git diff --cached --quiet; then
            echo "No firmware changes to commit"
            echo "bin_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update firmware binaries [skip ci]"
            git push
            echo "bin_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "Pushed firmware binaries for jsDelivr mirror"
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 关键：checkout build job 提交 bin 后的 commit，保证 manifest 引用的
      # jsDelivr@SHA 里就是本次构建的固件（而不是上一轮的旧 bin）
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.bin_sha }}

      - name: Pin bin SHA in manifest and stage
        run: |
          SHA=$(git rev-parse HEAD)
          echo "jsDelivr bins sha: $SHA"
          sed -i "s/__BIN_SHA__/$SHA/g" web/manifest.json
          # 校验：manifest 必须是合法 JSON 且已不含占位符
          python3 -c "import json;json.load(open('web/manifest.json'));print('manifest.json valid JSON')"
          grep -q "__BIN_SHA__" web/manifest.json && { echo "placeholder not replaced"; exit 1; } || true
          python3 -c "import json;json.load(open('web/manifest-local.json'));print('manifest-local.json valid JSON')"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
          name: github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
